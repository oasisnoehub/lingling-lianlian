services:
  lingling-lianlian:
    build: .
    networks:
      - frappe_network
      - traefik_public
    volumes:
      - lingling-data:/app/data
      - lingling-uploads:/app/uploads
      - lingling-backups:/app/backups
    environment:
      - NODE_ENV=production
      - PORT=3456
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - AMAP_KEY=${AMAP_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - AUTH_SECRET=${AUTH_SECRET}
      - PERSON_A_PASSWORD=${PERSON_A_PASSWORD}
      - PERSON_B_PASSWORD=${PERSON_B_PASSWORD}
      - BACKUP_DIR=/app/backups
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
      - BACKUP_UPLOADS_KEEP_DAYS=${BACKUP_UPLOADS_KEEP_DAYS:-7}
    restart: unless-stopped
    # Give the server time to checkpoint SQLite and close cleanly on redeploy.
    stop_grace_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.lingling.rule=Host(`linglian.oasisnoe.com.cn`)"
      - "traefik.http.routers.lingling.entrypoints=http,https"
      - "traefik.http.routers.lingling.tls=true"
      - "traefik.http.services.lingling.loadbalancer.server.port=3456"
      - "traefik.http.middlewares.lingling-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lingling-redirect-https.redirectscheme.permanent=true"

networks:
  frappe_network:
    external: true
  traefik_public:
    external: true

volumes:
  lingling-data:
  lingling-uploads:
  lingling-backups:
