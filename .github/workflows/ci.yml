name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: nothing in this workflow needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Install, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the node:20-alpine base image in the Dockerfile, so CI
          # validates the runtime that actually ships.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before build on purpose: `vite build` strips types with esbuild
      # without checking them, so this is the only step that catches frontend
      # type errors. Running it first surfaces failures in seconds.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Only reached when everything above passed.
      - name: Smoke test
        run: npm run smoke
